<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header
      class="header d-flex align-items-center sticky-top bg-body-tertiary p-2 shadow p-3 mb-5 rounded"
    ></header>
    <div class="flex-grow-1 mb-5">
      <div class="bg-brand-light py-5">
        <div class="container text-center">
          <h1 class="fw-bold brand-color display-4">Our Collection of Books</h1>
          <p class="text-muted lead">
            Organized collection of books, providing free access to literature,
            education, and information for the community.
          </p>
          <div class="input-group mb-3">
            <input
              type="text"
              class="form-control"
              placeholder="Search books..."
              aria-label="searchbar"
              aria-describedby="button-addon2"
              id="search"
            />
            <button
              class="btn btn-brand"
              type="button"
              id="button-addon2"
              onclick="handleSearch()"
            >
              Search
            </button>
          </div>
          <div class="dropdown">
            <a
              class="btn btn-brand dropdown-toggle"
              href="#"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Filter By Authors
            </a>

            <ul class="dropdown-menu">
              <li onclick="filterbooks(1)" class="p-2">
                <a class="dropdown-item" href="#"> Colleen Hoover</a>
              </li>
              <li onclick="filterbooks(2)" class="p-2">
                <a class="dropdown-item" href="#"> James Clear</a>
              </li>
              <li onclick="filterbooks(10)" class="p-2">
                <a class="dropdown-item" href="#"> Emily Henry </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <div
      class="row row-cols-1 row-cols-lg-4 row-cols-md-3 row-cols-sm-2 g-4 p-5"
    ></div>

    <footer class="footer bg-brand-light pt-5 pb-3 border-top"></footer>

    <script src="/js/header.js"></script>
    <script src="/js/footer.js"></script>

    <script src="/js/products.js"></script>
    <script>
      function handleSearch() {
        const searchInput = document.getElementById("search").value;

        // Create a new URL with search query parameter
        const newUrl = `/pages/products.html?search=${encodeURIComponent(searchInput)}`;

        // Redirect to the new URL
        window.location.href = newUrl;
      }

      function filterbooks(value) {
        const filterUrl = `/pages/products.html?name=${encodeURIComponent(value)}`;
        window.location.href = filterUrl;
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
