<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Page</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header
      class="header d-flex align-items-center sticky-top bg-body-tertiary p-2 shadow p-3 mb-5 rounded"
    ></header>
    <main
      class="container my-5 d-flex align-items-center justify-content-center"
    >
      <div class="row w-100 justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
          <div class="card border-0 shadow-lg p-4 bg-brand-light rounded-4">
            <div class="card-body text-center">
              <h2 class="brand-color mb-2">Create an Account</h2>
              <p class="text-muted mb-4">
                Join us and start building your library today.
              </p>
              <form id="registerForm" novalidate>
                <div class="text-start mb-3">
                  <label for="fullName" class="form-label brand-color"
                    >Full Name</label
                  >
                  <input
                    type="text"
                    class="form-control px-3 py-2"
                    id="fullName"
                    placeholder="e.g. Mostafa Rabea"
                    required
                  />
                  <div class="invalid-feedback">
                    Please enter your full name.
                  </div>
                  <!-- we will use this class in js in case of wrong input  -->
                </div>

                <div class="text-start mb-3">
                  <label for="email" class="form-label brand-color"
                    >Email Address</label
                  >
                  <input
                    type="email"
                    class="form-control px-3 py-2"
                    id="email"
                    placeholder="name@example.com"
                    required
                  />
                  <div class="invalid-feedback">
                    Please enter a valid email address.
                  </div>
                  <!-- we will use this class in js in case of wrong input  -->
                </div>

                <div class="text-start mb-3">
                  <label for="password" class="form-label brand-color"
                    >Password</label
                  >
                  <input
                    type="password"
                    class="form-control px-3 py-2"
                    id="password"
                    placeholder="Create a strong password"
                    required
                  />
                  <div class="invalid-feedback">
                    Password must be at least 8 characters.
                  </div>
                  <!-- we will use this class in js in case of wrong input  -->
                </div>

                <div class="text-start mb-4">
                  <label for="confirmPassword" class="form-label brand-color"
                    >Confirm Password</label
                  >
                  <input
                    type="password"
                    class="form-control px-3 py-2"
                    id="confirmPassword"
                    placeholder="Repeat your password"
                    required
                  />
                  <div class="invalid-feedback">Passwords do not match.</div>
                  <!-- we will use this class in js in case of wrong input  -->
                </div>

                <button
                  type="submit"
                  class="btn btn-brand w-100 py-2 mb-3 rounded-pill"
                >
                  Register
                </button>
                <p class="text-muted small mb-0">
                  Already have an account?
                  <a
                    href="/pages/login.html"
                    class="brand-color text-decoration-none"
                    >Sign in here</a
                  >
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer bg-brand-light pt-5 pb-3 border-top"></footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/signup.js"></script>
  </body>
</html>
