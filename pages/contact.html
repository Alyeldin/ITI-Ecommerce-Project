    <header

    <main>
      <section id="contact" class="contact section">
        <div class="container aos-init aos-animate" data-aos="fade">
          <div class="row gy-5 gx-lg-5">
            <div class="col-lg-4">
              <div
                class="info bg-brand-light p-4"
                style="box-shadow: 0px 2px 15px rgba(0, 0, 0, 0.2)"
              >
                <h3 class="sitefont fw-bold mb-2">Get in touch</h3>
                <p class="mb-5 bg fs-6 fw-light">
                  Your feedback is important to us. Please feel free to contact
                  us with any questions or concerns you may have. We will do our
                  best to assist you.
                </p>

                <div class="info-item d-flex pt-2 mt-2 border-top sitefont">
                  <i
                    class="bi bi-geo-alt flex-shrink-0"
                    style="margin-right: 20px; transition: all 0.3s ease-in-out"
                  ></i>
                  <div>
                    <h4 class="lh-1 mb-2 fw-bold fs-6">Location:</h4>
                    <p class="p-0 mb-0 fs-6">Sheikh Zayed, Cairo, Egypt</p>
                  </div>
                </div>

                <div class="info-item d-flex pt-2 mt-2 border-top sitefont">
                  <i
                    class="bi bi-envelope flex-shrink-0"
                    style="margin-right: 20px; transition: all 0.3s ease-in-out"
                  ></i>
                  <div>
                    <h4 class="lh-1 mb-2 fw-bold fs-6">Email:</h4>
                    <p class="p-0 mb-0 fs-6">info@example.com</p>
                  </div>
                </div>

                <div class="info-item d-flex pt-2 mt-2 border-top sitefont">
                  <i
                    class="bi bi-phone flex-shrink-0"
                    style="margin-right: 20px; transition: all 0.3s ease-in-out"
                  ></i>
                  <div>
                    <h4 class="lh-1 mb-2 fw-bold fs-6">Call:</h4>
                    <p class="p-0 mb-0 fs-6">+1 5589 55488 55</p>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-lg-8">
              <form
                action="forms/contact.php"
                method="post"
                role="form"
                class="php-email-form w-100"
              >
                <div class="row">
                  <div class="col-md-6 form-group pb-3">
                    <input
                      type="text"
                      name="name"
                      class="form-control"
                      id="name"
                      placeholder="Your Name"
                      required=""
                    />
                  </div>
                  <div class="col-md-6 form-group mt-3 mt-md-0">
                    <input
                      type="email"
                      class="form-control"
                      name="email"
                      id="email"
                      placeholder="Your Email"
                      required=""
                    />
                  </div>
                </div>
                <div class="form-group mt-3">
                  <input
                    type="text"
                    class="form-control"
                    name="subject"
                    id="subject"
                    placeholder="Subject"
                    required=""
                  />
                </div>
                <div class="form-group mt-3">
                  <textarea
                    class="form-control p-4"
                    style="height: 290px"
                    name="message"
                    placeholder="Message"
                    required=""
                  ></textarea>
                </div>

                <div class="text-center rounded mb-5 mt-5">
                  <button type="submit" class="btn-brand rounded p-3 mb-5">
                    Send Message
                  </button>
                </div>
              </form>
            </div>
            <!-- End Contact Form -->
          </div>
        </div>
