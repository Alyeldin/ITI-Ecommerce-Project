<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header
      class="header d-flex align-items-center sticky-top bg-body-tertiary p-2 shadow p-3 mb-5 rounded"
    ></header>
    <div class="bg-brand-light py-5">
      <div class="container text-center">
        <h3 class="fw-bold brand-color">Login With your account</h3>
        <p class="text-muted lead">Enter your account and password to login.</p>
      </div>
    </div>
    <main class="container-fluid d-flex mt-5 mb-5 align-items-center">
      <div class="row justify-content-center w-100">
        <div class="col-11 col-sm-9 col-md-6 col-lg-4">
          <form class="p-4 p-md-5 shadow rounded bg-brand-light">
            <div class="mb-3">
              <label
                for="exampleInputEmail1"
                class="form-label sitefont mb-2 fw-light fs-5 fs-md-4"
              >
                Email address:
              </label>
              <input
                type="email"
                class="form-control"
                id="exampleInputEmail1"
                aria-describedby="emailHelp"
                placeholder="Enter your email"
              />
            </div>

            <div class="mb-3">
              <label
                for="exampleInputPassword1"
                class="form-label sitefont mb-2 fw-light fs-5 fs-md-4"
              >
                Password:
              </label>
              <input
                type="password"
                class="form-control"
                id="exampleInputPassword1"
                placeholder="Enter your password"
              />
            </div>

            <button type="submit" class="btn-brand rounded-pill p-2 mb-2 mt-3 w-100">
              Submit
            </button>
          </form>
        </div>
      </div>
    </main>
    <footer class="footer bg-brand-light pt-5 pb-3 border-top"></footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/login.js"></script>
    
  </body>
</html>
