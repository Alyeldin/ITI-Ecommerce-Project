<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header
      class="header d-flex align-items-center sticky-top bg-body-tertiary p-2 shadow p-3 mb-5 rounded"
    ></header>
    <main class="container my-5 min-vh-90">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="sitename brand-color">Shopping Cart</h2>
        <span class="text-muted"><span id="cart-count">0</span> Items</span>
      </div>

      <div class="row gy-4">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm mb-3">
            <div class="card-body" id="cart-items-container"></div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card border-0 shadow-sm bg-brand-light p-3">
            <div class="card-body">
              <h5 class="brand-color mb-4">Order Summary</h5>

              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Subtotal</span>
                <span id="cart-subtotal">0.00 EGP</span>
              </div>

              <div class="d-flex justify-content-between mb-3">
                <span class="text-muted">Shipping</span>
                <span class="text-success">Free</span>
              </div>

              <hr class="text-muted" />

              <div class="d-flex justify-content-between mb-4">
                <span class="fs-5 brand-color">Total</span>
                <span class="fs-5 brand-color" id="cart-total">0.00 EGP</span>
              </div>

              <a
                href="checkout.html"
                class="btn btn-brand w-100 py-2 rounded-pill text-decoration-none text-white text-center"
                >Proceed to Checkout</a
              >
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer bg-brand-light pt-5 pb-3 border-top"></footer>

    <script src="/js/header.js"></script>
    <script src="/js/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/cart.js"></script>
  </body>
</html>
